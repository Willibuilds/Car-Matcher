<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin — MotorUnite Daily Picks</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" /></noscript>

  <style>
    :root {
      --bg: #f5f5f0;
      --surface: #ffffff;
      --surface2: #f9f9f7;
      --border: #e4e4de;
      --accent: #1a1a2e;
      --accent2: #0057FF;
      --text: #111118;
      --muted: #8a8a8a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* Login screen */
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login-logo {
      font-family: 'Orbitron', system-ui, sans-serif;
      font-weight: 800;
      font-size: 22px;
      color: var(--text);
      margin-bottom: 8px;
    }

    .login-logo span { color: var(--accent2); }

    .login-subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 32px;
    }

    .login-input {
      width: 100%;
      padding: 13px 16px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      background: var(--surface2);
      color: var(--text);
      margin-bottom: 12px;
      transition: border-color 0.18s;
    }

    .login-input:focus {
      outline: none;
      border-color: var(--accent2);
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      font-family: 'DM Sans', sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s;
    }

    .login-btn:hover { background: #2a2a4e; }

    .login-error {
      color: #e63329;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    /* Admin screen */
    .admin-screen { display: none; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 48px;
      background: var(--surface);
      border-bottom: 1.5px solid var(--border);
    }

    .logo {
      font-family: 'Orbitron', system-ui, sans-serif;
      font-weight: 800;
      font-size: 20px;
      color: var(--text);
    }

    .logo span { color: var(--accent2); }

    .admin-badge {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent2);
      border: 1.5px solid var(--accent2);
      padding: 6px 14px;
      border-radius: 999px;
    }

    .admin-wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 48px;
    }

    .admin-title {
      font-family: 'Orbitron', system-ui, sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 8px;
    }

    .admin-subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 40px;
    }

    .action-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 40px;
    }

    .btn-primary {
      padding: 12px 24px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      font-family: 'DM Sans', sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }

    .btn-primary:hover { background: #2a2a4e; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.5; cursor: default; transform: none; }

    .btn-secondary {
      padding: 12px 24px;
      background: transparent;
      color: var(--accent2);
      border: 1.5px solid var(--accent2);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      font-family: 'DM Sans', sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-secondary:hover { background: rgba(0,87,255,0.06); }
    .btn-secondary:disabled { opacity: 0.5; cursor: default; }

    .status-msg {
      font-size: 13px;
      padding: 10px 16px;
      border-radius: 8px;
      display: none;
      margin-bottom: 24px;
    }

    .status-msg.success { background: rgba(0,200,100,0.1); color: #00a050; border: 1px solid rgba(0,200,100,0.2); }
    .status-msg.error { background: rgba(230,51,41,0.1); color: #e63329; border: 1px solid rgba(230,51,41,0.2); }

    /* Pick editor cards */
    .picks-editor {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 32px;
    }

    .pick-editor-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 24px;
    }

    .pick-editor-card h3 {
      font-family: 'Orbitron', system-ui, sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent2);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .field-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
      margin-top: 14px;
      display: block;
    }

    .field-label:first-of-type { margin-top: 0; }

    .field-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      background: var(--surface2);
      color: var(--text);
      transition: border-color 0.18s;
    }

    .field-input:focus {
      outline: none;
      border-color: var(--accent2);
    }

    textarea.field-input {
      resize: vertical;
      min-height: 80px;
      line-height: 1.5;
    }

    @media (max-width: 860px) {
      header { padding: 16px 20px; }
      .admin-wrap { padding: 32px 20px; }
      .picks-editor { grid-template-columns: 1fr; }
      .action-bar { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="login-logo">Motor<span>Unite</span></div>
      <div class="login-subtitle">Admin — Daily Picks Manager</div>
      <input type="password" class="login-input" id="passwordInput" placeholder="Enter admin password" />
      <button class="login-btn" onclick="login()">Sign In</button>
      <div class="login-error" id="loginError">Incorrect password. Try again.</div>
    </div>
  </div>

  <!-- Admin Screen -->
  <div class="admin-screen" id="adminScreen">
    <header>
      <div class="logo">Motor<span>Unite</span></div>
      <div class="admin-badge">Admin Panel</div>
    </header>

    <div class="admin-wrap">
      <div class="admin-title">Daily Picks Manager</div>
      <div class="admin-subtitle">Generate today's picks automatically, or edit them manually below.</div>

      <div class="action-bar">
        <button class="btn-primary" id="generateBtn" onclick="generatePicks()">⚡ Auto-Generate Picks</button>
        <button class="btn-secondary" id="saveBtn" onclick="savePicks()">💾 Save Manual Edits</button>
        <a href="/picks.html" target="_blank" class="btn-secondary" style="text-decoration:none;display:inline-flex;align-items:center;">👁 Preview Page</a>
      </div>

      <div class="status-msg" id="statusMsg"></div>

      <div class="picks-editor" id="picksEditor">
        <!-- Cards rendered by JS -->
      </div>
    </div>
  </div>

  <script>
    let adminPassword = "";

    const defaultPicks = [
      { car: "", price: "", category: "Budget Pick", description: "", searchTerm: "" },
      { car: "", price: "", category: "Best Value", description: "", searchTerm: "" },
      { car: "", price: "", category: "Premium Choice", description: "", searchTerm: "" }
    ];

    function login() {
      const pw = document.getElementById("passwordInput").value;
      if (pw === "ClaudeCode123!") {
        adminPassword = pw;
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("adminScreen").style.display = "block";
        loadCurrentPicks();
      } else {
        document.getElementById("loginError").style.display = "block";
      }
    }

    document.getElementById("passwordInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") login();
    });

    async function loadCurrentPicks() {
      try {
        const res = await fetch("/api/get-picks");
        if (res.ok) {
          const data = await res.json();
          renderEditor(data.picks);
        } else {
          renderEditor(defaultPicks);
        }
      } catch {
        renderEditor(defaultPicks);
      }
    }

    function renderEditor(picks) {
      const categories = ["Budget Pick", "Best Value", "Premium Choice"];
      document.getElementById("picksEditor").innerHTML = picks.map((pick, i) => `
        <div class="pick-editor-card">
          <h3>${categories[i] || pick.category}</h3>
          <span class="field-label">Car Name</span>
          <input class="field-input" id="car-${i}" value="${pick.car || ""}" placeholder="e.g. Toyota Corolla 2022" />
          <span class="field-label">Price Range</span>
          <input class="field-input" id="price-${i}" value="${pick.price || ""}" placeholder="e.g. £8,000 - £12,000" />
          <span class="field-label">Description</span>
          <textarea class="field-input" id="desc-${i}" placeholder="Why is this a great car?">${pick.description || ""}</textarea>
          <span class="field-label">Wikipedia Search Term</span>
          <input class="field-input" id="search-${i}" value="${pick.searchTerm || ""}" placeholder="e.g. Toyota Corolla E210" />
        </div>
      `).join("");
    }

    function showStatus(msg, type) {
      const el = document.getElementById("statusMsg");
      el.textContent = msg;
      el.className = `status-msg ${type}`;
      el.style.display = "block";
      setTimeout(() => { el.style.display = "none"; }, 4000);
    }

    async function generatePicks() {
      const btn = document.getElementById("generateBtn");
      btn.disabled = true;
      btn.textContent = "Generating...";

      try {
        const res = await fetch(`/api/generate-picks?password=${encodeURIComponent(adminPassword)}`);
        const data = await res.json();

        if (res.ok && data.picks) {
          const picksArray = data.picks.picks || data.picks;
          renderEditor(Array.isArray(picksArray) ? picksArray : defaultPicks);
          showStatus("✓ Picks generated and saved successfully!", "success");
        } else {
          showStatus("✗ Generation failed: " + (data.error || JSON.stringify(data)), "error");
        }
      } catch (err) {
        showStatus("✗ Network error: " + err.message, "error");
      }

      btn.disabled = false;
      btn.textContent = "⚡ Auto-Generate Picks";
    }

    async function savePicks() {
      const btn = document.getElementById("saveBtn");
      btn.disabled = true;
      btn.textContent = "Saving...";

      const categories = ["Budget Pick", "Best Value", "Premium Choice"];
      const picks = [0, 1, 2].map(i => ({
        car: document.getElementById(`car-${i}`).value,
        price: document.getElementById(`price-${i}`).value,
        category: categories[i],
        description: document.getElementById(`desc-${i}`).value,
        searchTerm: document.getElementById(`search-${i}`).value
      }));

      try {
        const res = await fetch("/api/save-picks", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: adminPassword, picks })
        });

        const data = await res.json();
        if (res.ok) {
          showStatus("✓ Picks saved successfully!", "success");
        } else {
          showStatus("✗ Save failed: " + (data.error || "Unknown error"), "error");
        }
      } catch (err) {
        showStatus("✗ Network error: " + err.message, "error");
      }

      btn.disabled = false;
      btn.textContent = "💾 Save Manual Edits";
    }
  </script>

</body>
</html>
